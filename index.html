<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ E.SUN x 114Q2 x 特工部隊戰術控制台</title>
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: rgba(28, 37, 65, 0.6);
            --border-color: rgba(16, 185, 129, 0.25);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --esun-green: #10b981;
            --esun-glow: rgba(16, 185, 129, 0.4);
            --terminal-red: #f43f5e;
            --panel-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 24px 16px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.08) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 2;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            padding: 20px 16px;
            background: linear-gradient(135deg, rgba(28, 37, 65, 0.8) 0%, rgba(11, 19, 43, 0.8) 100%);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--panel-shadow), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 8px 0;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
            background: linear-gradient(to right, #fff, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #a7f3d0;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .countdown-box {
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #fda4af;
            font-weight: 700;
            display: inline-block;
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.15);
        }

        /* 頂部集體物資補給專區 */
        .food-helper-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 12px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--panel-shadow);
        }

        .food-btn-group {
            display: flex;
            gap: 12px;
        }

        .food-action-btn {
            flex: 1;
            background: linear-gradient(135deg, rgba(58, 80, 107, 0.4) 0%, rgba(28, 37, 65, 0.6) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .food-action-btn:hover {
            border-color: var(--esun-green);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
        }

        .food-result-display {
            margin-top: 10px;
            padding: 12px;
            background: rgba(11, 19, 43, 0.7);
            border-radius: 10px;
            font-size: 0.85rem;
            color: #e2e8f0;
            display: none;
            border-left: 4px solid var(--esun-green);
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        /* 🎮 紓壓趣味小遊戲專區 */
        .game-box {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 16px;
            text-align: center;
            box-shadow: var(--panel-shadow);
        }

        .game-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: #c7d2fe;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .game-screen {
            background: #0b1329;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 16px 10px;
            min-height: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .game-target {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--terminal-red);
            animation: pulse 0.5s infinite alternate;
            word-break: break-all;
        }

        .game-stats {
            font-size: 0.8rem;
            color: #818cf8;
            font-weight: 600;
            margin-top: 4px;
        }

        .game-btn {
            width: 100%;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: all 0.1s ease;
        }
        .game-btn:active {
            transform: scale(0.98);
            filter: brightness(1.1);
        }

        /* 第一層：部隊編制切換 */
        .level-selector {
            display: flex;
            background: rgba(11, 19, 43, 0.9);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 6px;
            border-radius: 16px;
            margin-bottom: 14px;
            gap: 6px;
            box-shadow: var(--panel-shadow);
        }

        .level-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 12px 0;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        .level-btn.active {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: #fff;
            box-shadow: 0 4px 12px var(--esun-glow);
        }

        /* 第二層：Staff 子角色切換 */
        .staff-sub-selector {
            display: flex;
            background: rgba(28, 37, 65, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 14px;
            margin-bottom: 18px;
            gap: 4px;
        }

        .staff-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 10px 0;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: all 0.2s;
        }

        .staff-btn:hover {
            color: #fff;
        }

        .staff-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--esun-green);
            font-weight: 700;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        /* 全體聯合作戰總進度條 */
        .progress-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: var(--panel-shadow);
        }

        .progress-text-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 10px;
        }

        #progress-percent {
            color: var(--esun-green);
            font-weight: 800;
            text-shadow: 0 0 8px var(--esun-glow);
        }

        .progress-bar-bg {
            background: #0b1329;
            height: 10px;
            width: 100%;
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #10b981 0%, #34d399 100%);
            height: 100%;
            width: 0%;
            border-radius: 999px;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px var(--esun-glow);
        }

        /* 任務頒布區 */
        .input-section {
            background: rgba(11, 19, 43, 0.8);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 16px;
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            box-shadow: var(--panel-shadow);
        }

        .input-section input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .input-section input::placeholder {
            color: #64748b;
        }

        .add-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0 18px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .add-btn:hover {
            opacity: 0.9;
        }

        /* 待辦項目清單 */
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .todo-item {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px 16px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: var(--panel-shadow);
            transition: all 0.2s;
            position: relative;
        }

        .todo-item:hover {
            border-color: rgba(16, 185, 129, 0.2);
        }

        .todo-top-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .todo-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            cursor: pointer;
        }

        /* 狀態徽章 */
        .status-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            min-width: 45px;
            text-align: center;
        }
        .status-0 { background: rgba(148, 163, 184, 0.1); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.2); }
        .status-33 { background: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.2); }
        .status-66 { background: rgba(245, 158, 11, 0.1); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.2); }
        .status-100 { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }

        .todo-text {
            font-size: 0.95rem;
            line-height: 1.4;
            color: #e2e8f0;
            transition: color 0.2s;
        }

        .todo-mini-progress-box {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .todo-mini-bg {
            flex: 1;
            background: rgba(11, 19, 43, 0.6);
            height: 5px;
            border-radius: 99px;
            overflow: hidden;
        }
        .todo-mini-fill {
            height: 100%;
            width: 0%;
            border-radius: 99px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        .fill-0 { width: 0%; background: transparent; }
        .fill-33 { width: 33%; background: #3b82f6; }
        .fill-66 { width: 66%; background: #f59e0b; }
        .fill-100 { width: 100%; background: #10b981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.4); }

        .todo-item.completed-card .todo-text {
            text-decoration: line-through;
            color: #64748b;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--terminal-red);
            cursor: pointer;
            opacity: 0.4;
            padding: 4px;
            font-size: 0.95rem;
            transition: opacity 0.2s;
            margin-top: 2px;
        }

        .delete-btn:hover {
            opacity: 1;
        }

        /* 安全撤離按鈕 */
        .logout-btn {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255,255,255,0.05);
            color: #475569;
            padding: 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: not-allowed;
            width: 100%;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: var(--panel-shadow);
        }

        .logout-btn.ready {
            background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
            border: none;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
        }

        /* 彈出視窗 */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 19, 43, 0.95);
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(8px);
        }

        .modal {
            background: #1c2541;
            border: 1px solid var(--border-color);
            padding: 28px 24px;
            border-radius: 24px;
            max-width: 340px;
            width: 88%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .food-recommend {
            background: rgba(16, 185, 129, 0.1);
            padding: 12px;
            border-radius: 12px;
            margin: 16px 0;
            font-weight: 700;
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .quote {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .close-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--esun-glow);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            from { transform: scale(1); opacity: 0.9; }
            to { transform: scale(1.03); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚡ OPERATION E.SUN Q2</h1>
            <div class="subtitle">玉山Team特工部隊控制台</div>
            <div class="countdown-box" id="countdown-display">⏳ 距離 死線決戰：計算中...</div>
        </header>

        <!-- 集體行動補給專區 -->
        <div class="food-helper-box">
            <div class="food-btn-group">
                <button class="food-action-btn" onclick="getRandomFood('lunch')">🥪 集體中午吃啥？</button>
                <button class="food-action-btn" onclick="getRandomFood('drink')">🥤 集體下午茶點啥？</button>
            </div>
            <div id="food-result" class="food-result-display"></div>
        </div>

        <!-- 🎮 紓壓解悶遊戲艙 -->
        <div class="game-box">
            <div class="game-title">🎮 戰術防線 // 暴打底稿紓壓艙</div>
            <div class="game-screen">
                <div id="game-text" class="game-target">READY PLAYER ONE</div>
                <div id="game-status" class="game-stats">查核壓力過大？點擊下方開始作戰！</div>
            </div>
            <button id="game-action-btn" class="game-btn" onclick="handleGameClick()">⚡ 開始暴打大作戰</button>
        </div>

        <!-- 第一層：部隊編制切換 -->
        <div class="level-selector">
            <button class="level-btn active" id="lvl-ic" onclick="switchLevel('ic')">指揮官 吉伊 🐹</button>
            <button class="level-btn" id="lvl-staff" onclick="switchLevel('staff')">突擊前線 (Staff)</button>
            <button class="level-btn" id="lvl-manager" onclick="switchLevel('manager')">戰術參謀 🐰</button>
            <button class="level-btn" id="lvl-partner" onclick="switchLevel('partner')">最高統帥 🌰</button>
        </div>

        <!-- 第二層：突擊前線部隊代號 -->
        <div class="staff-sub-selector" id="staff-sub-box" style="display: none;">
            <button class="staff-btn active" data-staff="usagi" onclick="switchStaff('usagi')"><span>🐰</span><span>兔兔隊員</span></button>
            <button class="staff-btn" data-staff="hachiware" onclick="switchStaff('hachiware')"><span>🐱</span><span>小八隊員</span></button>
            <button class="staff-btn" data-staff="mome" onclick="switchStaff('mome')"><span>🐿️</span><span>小桃隊員</span></button>
            <button class="staff-btn" data-staff="kuhon" onclick="switchStaff('kuhon')"><span>🐷</span><span>古本屋隊員</span></button>
        </div>

        <!-- 全體聯合作戰總進度條 -->
        <div class="progress-container">
            <div class="progress-text-row">
                <span id="progress-role-label">🌍 全體特工聯合作戰總進度</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <!-- 各自待完成事項頒布區 -->
        <div class="input-section">
            <input type="text" id="todo-input" placeholder="新增當前角色的待完成任務..." onkeypress="handleKeyPress(event)">
            <button class="add-btn" onclick="addTodo()">新增</button>
        </div>

        <!-- 行動任務清單 -->
        <div class="todo-list" id="todo-list"></div>

        <!-- 強制撤離登出 -->
        <div class="logout-section">
            <button class="logout-btn" id="shutdown-btn" onclick="triggerShutdown()">🔒 請先消除此角色的所有威脅以解鎖撤離</button>
        </div>
    </div>

    <!-- 行動回報彈出視窗 -->
    <div id="overlay" class="overlay">
        <div class="modal">
            <h2 style="color: #34d399; margin-top:0; font-weight: 800;">💥 TACTICAL CLEAR</h2>
            <div id="modal-title" class="food-recommend"></div>
            <p id="modal-quote" class="quote"></p>
            <button class="close-btn" onclick="closeModal()">⚡「安全撤離，強制斷電！」</button>
        </div>
    </div>

    <script>
        const defaultTasks = {
            "ic": ["[⚔️核心突擊] 攻克大魔王所得稅，要怎麼調DTA/DTL", "[⚔️關鍵防線] 編製現金流量表，這科目怎麼還是有差啊", "[📡戰術指揮] 監控Staff特工部隊的查核進度"],
            "staff_usagi": ["[🐰銀行合併] 三家子公司沖銷=認準顏色分啊分", "[🐰創投] 都這做了一年了，「呀哈！」這簡單啦"],
            "staff_hachiware": ["[🐱三商救援] 我會回來玉山的！", "[🐱支援] 時不時來問候一下玉山的兄弟們"],
            "staff_mome": ["[🐢函證] 理解，我知道要怎麼快速發函證了！", "[🐿️心理防禦] 吃掉敵方零食"],
            "staff_kuhon": ["[🐷戰術整理] 關係人和不動產是我的第一門課", "[🐷物資跟進] 我接下來要幹嘛呢"],
            "manager": ["[👔戰術覆核] 我要先學會閉嘴下來做事了", "[👔外交斡旋] 客戶怎麼又來找我的好煩啊"],
            "partner": ["🌰 [最終簽核] 我要學會不龜毛不要下那麼多note", "🌰 [風險裁決] 我只要不龜毛就好了"]
        };

        const roleMeta = {
            "ic": { name: "指揮官 吉伊卡哇 🐹", done: "哇…（流淚）！所得稅與現金流量表全數平齊！指揮官今晚頂住死線壓力，全體安全撤離，立刻躲進被窩強制斷電！" },
            "staff_usagi": { name: "突擊特工 兔兔 🐰", done: "烏拉！！！呀哈！！！兔兔特工以風捲快速解決了所有底稿！現在立刻拋下武器，全速奔跑回家強制關機！" },
            "staff_hachiware": { name: "醫護特工 小八貓 🐱", done: "「總會有辦法的！」小八隊員任務全數歸零，快放下滑鼠，喝碗熱湯好好睡一覺吧！" },
            "staff_mome": { name: "偽裝特工 小桃鼠 🐿️", done: "哼哼～小桃特工出馬，沒有搞不定的底稿！本少爺現在下達最高指令：立刻撤離下班，強制關機！" },
            "staff_kuhon": { name: "後勤特工 古本屋 🐷", done: "防線整理完畢！古本屋隊員默默把所有底稿歸檔得完美無瑕！辛苦了，快強制斷電休息去！" },
            "manager": { name: "戰術參謀 經理 🐰", done: "經理參謀辛苦了！防線防守成功，Q2 風暴順利解除，現在馬上跟著兔兔隊員一起快樂斷電下班！" },
            "partner": { name: "最高統帥 栗子饅頭 🌰", done: "哈啊——！（吐氣）報告簽核完畢！今晚最完美的特工配置就是立刻撤離，回去享受大叔般的深夜安穩睡眠！" }
        };

        const foodDatabase = {
            lunch: [
                "🏪 7-11（極速應援！便當/御飯糰/關東煮）", "🏪 全家（便利續命！夯番薯/微波義大利麵）",
                "🍜 熱騰騰雞塊麵（辦公室最抗壓的邪惡組合）", "🍢 罪惡大滷味（自由挑選，加辣破壞疲勞）",
                "🥗 少油低卡健康餐盒（維持高強度作戰腦力）", "🍛 濃郁系咖哩飯（查核空檔的精神支柱）",
                "🥟 爆汁鍋貼水餃（快狠準高熱量方案）", "🍱 經典排骨/雞腿便當（應付爆肝下午的熱量地基）",
                "🍔 美式漢堡炸雞套餐（死線前的靈魂救贖）", "🍣 壽司生魚片丼飯（清爽避免下午打瞌睡）",
                "🍜 日式拉麵/烏龍麵（溫暖被查核折磨的胃）", "🍲 台式個人小火鍋（深夜民生東路小確幸）"
            ],
            drink: [
                "🧋 50嵐（經典 1 號四季春珍波椰）", "🥤 得正 Oolong Tea（烘焙烏龍加嫩仙草/茶凍）",
                "🧋 可不可熟成紅茶（熟成歐蕾，內耗數字靈藥）", "🍵 烏弄 UNOCHA（金萱冬片無糖加杏仁凍）",
                "🍼 約翰紅茶公司（煮濃那鐵，頂級乳香治癒心靈）", "🍇 麻古茶坊（高山金萱茶/芝芝果粒大暴走）",
                "🥛 迷客夏 Milksha（珍珠手炒黑糖鮮奶）", "🍼 五桐號 WooTea（五桐茶加杏仁凍/青茶凍）"
            ]
        };

        // 🎮 小遊戲資料庫
        const gameBugs = [
            "💥 💥 💥 討厭的 DTA 算錯啦！",
            "💣 💣 💣 現金流量表又不平了！",
            "🔥 🔥 🔥 經理又下了一百個 Note！",
            "💀 💀 💀 客戶塞了一堆廢紙當憑證！
            "🥊 🥊 🥊 討厭的合併報表沖銷！",
            "⚡ ⚡ ⚡ 系統快要斷線啦！"
        ];
        const gameRankings = [
            "🐹 吉伊卡哇評價：哇…哇…！（嚇哭）但你太強了！擊碎了大量查核屏障！",
            "🐰 兔兔評價：烏拉！呀哈！呀——哈！！你把底稿全部撕碎了！",
            "🌰 栗子大叔評價：哈啊——（灌一口啤酒）！這手速夠格陪我熬夜！"
        ];

        let gameState = { active: false, score: 0, timeLeft: 10, timer: null };
        let currentLevel = localStorage.getItem("tg_lvl") || "ic"; 
        let currentStaff = localStorage.getItem("tg_stf") || "usagi"; 
        let allTodos = JSON.parse(localStorage.getItem("tg_todos_v7")) || {};

        function getActiveKey() {
            return currentLevel === "staff" ? `staff_${currentStaff}` : currentLevel;
        }

        if (Object.keys(allTodos).length === 0) {
            Object.keys(defaultTasks).forEach(k => {
                allTodos[k] = defaultTasks[k].map(t => ({ text: t, progress: 0 }));
            });
        }

        // 🎮 紓壓遊戲邏輯區
        function handleGameClick() {
            const btn = document.getElementById("game-action-btn");
            const textEl = document.getElementById("game-text");
            const statusEl = document.getElementById("game-status");

            if (!gameState.active) {
                // 開始遊戲
                gameState.active = true;
                gameState.score = 0;
                gameState.timeLeft = 10;
                btn.innerText = "🥊 集中火力！用力猛擊！！";
                textEl.innerText = gameBugs[Math.floor(Math.random() * gameBugs.length)];
                statusEl.innerText = `⏱️ 剩餘時間: ${gameState.timeLeft}s | 🔥 COMBO: 0`;

                gameState.timer = setInterval(() => {
                    gameState.timeLeft--;
                    if (gameState.timeLeft <= 0) {
                        // 遊戲結束
                        clearInterval(gameState.timer);
                        gameState.active = false;
                        btn.innerText = "⚡ 再戰一輪紓壓";
                        textEl.innerText = `🏆 最終戰績：${gameState.score} 連擊！`;
                        
                        let rank = gameRankings[0];
                        if (gameState.score > 25) rank = gameRankings[1];
                        if (gameState.score > 45) rank = gameRankings[2];
                        statusEl.innerText = rank;
                    } else {
                        statusEl.innerText = `⏱️ 剩餘時間: ${gameState.timeLeft}s | 🔥 COMBO: ${gameState.score}`;
                    }
                }, 100);
            } else {
                // 遊戲進行中點擊：得分、切換隨機崩潰句
                gameState.score++;
                if (gameState.score % 4 === 0) {
                    textEl.innerText = gameBugs[Math.floor(Math.random() * gameBugs.length)];
                }
                statusEl.innerText = `⏱️ 剩餘時間: ${gameState.timeLeft}s | 🔥 COMBO: ${gameState.score}`;
            }
        }

        function switchLevel(lvl) {
            currentLevel = lvl;
            localStorage.setItem("tg_lvl", lvl);
            document.querySelectorAll(".level-btn").forEach(b => b.classList.remove("active"));
            document.getElementById(`lvl-${lvl}`).classList.add("active");

            const staffBox = document.getElementById("staff-sub-box");
            staffBox.style.display = (lvl === "staff") ? "flex" : "none";
            render();
        }

        function switchStaff(stf) {
            currentStaff = stf;
            localStorage.setItem("tg_stf", stf);
            document.querySelectorAll(".staff-btn").forEach(b => b.classList.remove("active"));
            const btn = document.querySelector(`.staff-btn[data-staff="${stf}"]`);
            if (btn) btn.classList.add("active");
            render();
        }

        function updateProgress() {
            let totalScore = 0;
            let maxPossibleScore = 0;
            let activeCompleted = true;
            let activeTaskCount = 0;

            const activeKey = getActiveKey();

            Object.keys(allTodos).forEach(k => {
                allTodos[k].forEach(t => {
                    totalScore += t.progress;
                    maxPossibleScore += 100;

                    if (k === activeKey) {
                        activeTaskCount++;
                        if (t.progress < 100) {
                            activeCompleted = false;
                        }
                    }
                });
            });

            const totalPct = maxPossibleScore === 0 ? 0 : Math.round((totalScore / maxPossibleScore) * 100);
            document.getElementById("progress-percent").innerText = `${totalPct}%`;
            document.getElementById("progress-fill").style.width = `${totalPct}%`;

            const btn = document.getElementById("shutdown-btn");
            if (activeCompleted && activeTaskCount > 0) {
                btn.classList.add("ready");
                btn.innerText = `💥 [${roleMeta[activeKey].name.split(' ')[1]}] 任務全清空！安全撤離解鎖`;
                btn.disabled = false;
            } else {
                btn.classList.remove("ready");
                btn.innerText = `🔒 請先消除此角色的所有威脅以解鎖撤離`;
                btn.disabled = true;
            }
        }

        function render() {
            const key = getActiveKey();
            const listEl = document.getElementById("todo-list");
            listEl.innerHTML = "";
            const list = allTodos[key] || [];

            list.forEach((todo, idx) => {
                const item = document.createElement("div");
                const isDone = todo.progress === 100;
                item.className = `todo-item ${isDone ? 'completed-card' : ''}`;
                
                let badgeText = "未開始";
                if (todo.progress === 33) badgeText = "進行中";
                if (todo.progress === 66) badgeText = "覆核中";
                if (todo.progress === 100) badgeText = "已攻克";

                item.innerHTML = `
                    <div class="todo-top-row">
                        <div class="todo-left" onclick="cycleProgress(${idx})">
                            <span class="status-badge status-${todo.progress}">${badgeText}</span>
                            <div class="todo-text">${todo.text}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteTodo(${idx})">✕</button>
                    </div>
                    <div class="todo-mini-progress-box">
                        <div class="todo-mini-bg">
                            <div class="todo-mini-fill fill-${todo.progress}"></div>
                        </div>
                        <span style="font-size: 0.7rem; font-weight: 700; color: var(--text-sub); width: 28px; text-align: right;">${todo.progress}%</span>
                    </div>
                `;
                listEl.appendChild(item);
            });

            localStorage.setItem("tg_todos_v7", JSON.stringify(allTodos));
            updateProgress();
        }

        function cycleProgress(idx) {
            const key = getActiveKey();
            let current = allTodos[key][idx].progress || 0;
            if (current === 0) current = 33;
            else if (current === 33) current = 66;
            else if (current === 66) current = 100;
            else current = 0;
            
            allTodos[key][idx].progress = current;
            render();
        }

        function addTodo() {
            const input = document.getElementById("todo-input");
            const text = input.value.trim();
            if (text) {
                const key = getActiveKey();
                allTodos[key].unshift({ text: text, progress: 0 });
                input.value = "";
                render();
            }
        }

        function handleKeyPress(e) { if (e.key === "Enter") addTodo(); }
        function deleteTodo(idx) { const key = getActiveKey(); allTodos[key].splice(idx, 1); render(); }

        function getRandomFood(type) {
            const list = foodDatabase[type];
            const res = list[Math.floor(Math.random() * list.length)];
            const el = document.getElementById("food-result");
            el.style.display = "block";
            el.innerHTML = type === 'lunch' ? `📦 <b>今日集體午餐雷達：</b><br>${res}` : `🥤 <b>今日集體下午茶雷達：</b><br>${res}`;
        }

        function updateCountdown() {
            const target = new Date("2026-08-14T00:00:00+08:00");
            const diff = target - new Date();
            if (diff <= 0) {
                document.getElementById("countdown-display").innerText = "💥 ACTION COMPLETE // 突擊日已到，全員撤離！";
                return;
            }
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff % 86400000) / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            document.getElementById("countdown-display").innerText = `⏳ 距離 8/14 死線決戰：${d} 天 ${h} 小時 ${m} 分`;
        }

        function triggerShutdown() {
            const key = getActiveKey();
            document.getElementById("modal-title").innerText = `💥 代號 [${roleMeta[key].name}] 戰線全面清空！`;
            document.getElementById("modal-quote").innerText = roleMeta[key].done;
            document.getElementById("overlay").style.display = "flex";
        }
        function closeModal() { document.getElementById("overlay").style.display = "none"; }

        document.addEventListener("DOMContentLoaded", () => {
            switchLevel(currentLevel);
            if (currentLevel === "staff") switchStaff(currentStaff);
            setInterval(updateCountdown, 60000);
            updateCountdown();
        });
    </script>
</body>
</html>
