<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ E.SUN x 114Q2 x 特工部隊戰術控制台</title>
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: rgba(28, 37, 65, 0.6);
            --border-color: rgba(16, 185, 129, 0.25);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --esun-green: #10b981;
            --esun-glow: rgba(16, 185, 129, 0.4);
            --terminal-red: #f43f5e;
            --panel-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 24px 16px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.08) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 2;
        }

        header {
            text-align: center;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            padding: 20px 16px;
            background: linear-gradient(135deg, rgba(28, 37, 65, 0.8) 0%, rgba(11, 19, 43, 0.8) 100%);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--panel-shadow), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 8px 0;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
            background: linear-gradient(to right, #fff, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #a7f3d0;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .countdown-box {
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #fda4af;
            font-weight: 700;
            display: inline-block;
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.15);
        }

        /* 頂部集體物資補給專區 */
        .food-helper-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 12px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--panel-shadow);
        }

        .food-btn-group {
            display: flex;
            gap: 12px;
        }

        .food-action-btn {
            flex: 1;
            background: linear-gradient(135deg, rgba(58, 80, 107, 0.4) 0%, rgba(28, 37, 65, 0.6) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .food-action-btn:hover {
            border-color: var(--esun-green);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
        }

        .food-result-display {
            margin-top: 10px;
            padding: 12px;
            background: rgba(11, 19, 43, 0.7);
            border-radius: 10px;
            font-size: 0.85rem;
            color: #e2e8f0;
            display: none;
            border-left: 4px solid var(--esun-green);
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        /* 🛠️ 特工查核實用工具箱 */
        .utility-box {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.25);
            border-radius: 20px;
            padding: 14px;
            margin-bottom: 16px;
            box-shadow: var(--panel-shadow);
        }

        .util-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: #93c5fd;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .util-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .util-input {
            flex: 1;
            background: #0b1329;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 10px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }
        .util-input:focus {
            border-color: #60a5fa;
        }

        .util-btn {
            background: #2563eb;
            border: none;
            color: #fff;
            padding: 0 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .util-btn:hover { background: #3b82f6; }

        .util-result-label {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 4px;
            padding-left: 2px;
        }

        /* 💰 萬億中文化顯示框 */
        .chinese-num-preview {
            background: rgba(11, 19, 43, 0.8);
            border: 1px solid rgba(96, 165, 250, 0.2);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.85rem;
            color: #38bdf8;
            font-weight: 700;
            min-height: 20px;
            word-break: break-all;
            margin-bottom: 12px;
        }

        /* 兩數差異值顯示 */
        #diff-output {
            font-size: 0.85rem;
            font-weight: 700;
            color: #f43f5e;
            display: flex;
            align-items: center;
            min-width: 60px;
            justify-content: center;
        }

        /* 心態續命專區 */
        .quote-shifter {
            background: rgba(11, 19, 43, 0.6);
            border-radius: 10px;
            padding: 10px;
            font-size: 0.8rem;
            color: #cbd5e1;
            border-left: 3px solid #60a5fa;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        .quote-shifter:hover {
            background: rgba(11, 19, 43, 0.9);
        }

        /* 第一層：部隊編制切換 */
        .level-selector {
            display: flex;
            background: rgba(11, 19, 43, 0.9);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 6px;
            border-radius: 16px;
            margin-bottom: 14px;
            gap: 6px;
            box-shadow: var(--panel-shadow);
        }

        .level-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 12px 0;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        .level-btn.active {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: #fff;
            box-shadow: 0 4px 12px var(--esun-glow);
        }

        /* 第二層：Staff 子角色切換 */
        .staff-sub-selector {
            display: flex;
            background: rgba(28, 37, 65, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 4px;
            border-radius: 14px;
            margin-bottom: 18px;
            gap: 4px;
        }

        .staff-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 10px 0;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: all 0.2s;
        }

        .staff-btn:hover {
            color: #fff;
        }

        .staff-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--esun-green);
            font-weight: 700;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        /* 全體聯合作戰總進度條 */
        .progress-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: var(--panel-shadow);
        }

        .progress-text-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 10px;
        }

        #progress-percent {
            color: var(--esun-green);
            font-weight: 800;
            text-shadow: 0 0 8px var(--esun-glow);
        }

        .progress-bar-bg {
            background: #0b1329;
            height: 10px;
            width: 100%;
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #10b981 0%, #34d399 100%);
            height: 100%;
            width: 0%;
            border-radius: 999px;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px var(--esun-glow);
        }

        /* 任務頒布區 */
        .input-section {
            background: rgba(11, 19, 43, 0.8);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 16px;
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            box-shadow: var(--panel-shadow);
        }

        .input-section input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .input-section input::placeholder {
            color: #64748b;
        }

        .add-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0 18px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .add-btn:hover {
            opacity: 0.9;
        }

        /* 待辦項目清單 */
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .todo-item {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 14px 16px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: var(--panel-shadow);
            transition: all 0.2s;
            position: relative;
        }

        .todo-item:hover {
            border-color: rgba(16, 185, 129, 0.2);
        }

        .todo-top-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .todo-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            cursor: pointer;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            min-width: 45px;
            text-align: center;
        }
        .status-0 { background: rgba(148, 163, 184, 0.1); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.2); }
        .status-33 { background: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.2); }
        .status-66 { background: rgba(245, 158, 11, 0.1); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.2); }
        .status-100 { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }

        .todo-text {
            font-size: 0.95rem;
            line-height: 1.4;
            color: #e2e8f0;
            transition: color 0.2s;
        }

        .todo-mini-progress-box {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .todo-mini-bg {
            flex: 1;
            background: rgba(11, 19, 43, 0.6);
            height: 5px;
            border-radius: 99px;
            overflow: hidden;
        }
        .todo-mini-fill {
            height: 100%;
            width: 0%;
            border-radius: 99px;
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        .fill-0 { width: 0%; background: transparent; }
        .fill-33 { width: 33%; background: #3b82f6; }
        .fill-66 { width: 66%; background: #f59e0b; }
        .fill-100 { width: 100%; background: #10b981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.4); }

        .todo-item.completed-card .todo-text {
            text-decoration: line-through;
            color: #64748b;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--terminal-red);
            cursor: pointer;
            opacity: 0.4;
            padding: 4px;
            font-size: 0.95rem;
            transition: opacity 0.2s;
            margin-top: 2px;
        }

        .delete-btn:hover {
            opacity: 1;
        }

        /* 安全撤離按鈕 */
        .logout-btn {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255,255,255,0.05);
            color: #475569;
            padding: 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: not-allowed;
            width: 100%;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: var(--panel-shadow);
        }

        .logout-btn.ready {
            background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
            border: none;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
        }

        /* 彈出視窗 */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 19, 43, 0.95);
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(8px);
        }

        .modal {
            background: #1c2541;
            border: 1px solid var(--border-color);
            padding: 28px 24px;
            border-radius: 24px;
            max-width: 340px;
            width: 88%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .food-recommend {
            background: rgba(16, 185, 129, 0.1);
            padding: 12px;
            border-radius: 12px;
            margin: 16px 0;
            font-weight: 700;
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .quote {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .close-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--esun-glow);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚡ OPERATION E.SUN Q2</h1>
            <div class="subtitle">玉山Team特工部隊控制台</div>
            <div class="countdown-box" id="countdown-display">⏳ 距離 死線決戰：計算中...</div>
        </header>

        <div class="food-helper-box">
            <div class="food-btn-group">
                <button class="food-action-btn" onclick="getRandomFood('lunch')">🥪 集體中午吃啥？</button>
                <button class="food-action-btn" onclick="getRandomFood('drink')">🥤 集體下午茶點啥？</button>
            </div>
            <div id="food-result" class="food-result-display"></div>
        </div>

        <div class="utility-box">
            <div class="util-title">🛠️ 特工查核前線工具箱</div>
            
            <div class="util-result-label">1. 金額千分位與中文翻譯（支援複製）</div>
            <div class="util-row">
                <input type="text" id="comma-input" class="util-input" placeholder="直接貼上純數字..." oninput="formatCommaNum()">
                <button class="util-btn" onclick="copyCommaNum()">📋 複製數字</button>
            </div>
            <div id="chinese-num-box" class="chinese-num-preview">💡 字幕提示：請在上方輸入金額數字</div>

            <div class="util-result-label">2. 兩數查核絕對差異值</div>
            <div class="util-row">
                <input type="number" id="diff-a" class="util-input" placeholder="數字 A" oninput="calcDifference()">
                <input type="number" id="diff-b" class="util-input" placeholder="數字 B" oninput="calcDifference()">
                <div id="diff-output">Δ: 0</div>
            </div>

            <div class="util-result-label">3. 查核心態續命語錄 (點擊切換)</div>
            <div id="quote-box" class="quote-shifter" onclick="shiftAuditQuote()">
                「沒事的，平不了就找經理，總會有辦法的… 🐱」
            </div>
        </div>

        <div class="level-selector">
            <button class="level-btn active" id="lvl-ic" onclick="switchLevel('ic')">指揮官 吉伊 🐹</button>
            <button class="level-btn" id="lvl-staff" onclick="switchLevel('staff')">突擊前線 (Staff)</button>
            <button class="level-btn" id="lvl-manager" onclick="switchLevel('manager')">戰術參謀 🐰</button>
            <button class="level-btn" id="lvl-partner" onclick="switchLevel('partner')">最高統帥 🌰</button>
        </div>

        <div class="staff-sub-selector" id="staff-sub-box" style="display: none;">
            <button class="staff-btn active" data-staff="usagi" onclick="switchStaff('usagi')"><span>🐰</span><span>兔兔隊員</span></button>
            <button class="staff-btn" data-staff="hachiware" onclick="switchStaff('hachiware')"><span>🐱</span><span>小八隊員</span></button>
            <button class="staff-btn" data-staff="mome" onclick="switchStaff('mome')"><span>🐿️</span><span>小桃隊員</span></button>
            <button class="staff-btn" data-staff="kuhon" onclick="switchStaff('kuhon')"><span>🐷</span><span>古本屋隊員</span></button>
        </div>

        <div class="progress-container">
            <div class="progress-text-row">
                <span id="progress-role-label">🌍 全體特工聯合作戰總進度</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <div class="input-section">
            <input type="text" id="todo-input" placeholder="新增當前角色的待完成任務..." onkeypress="handleKeyPress(event)">
            <button class="add-btn" onclick="addTodo()">新增</button>
        </div>

        <div class="todo-list" id="todo-list"></div>

        <div class="logout-section">
            <button class="logout-btn" id="shutdown-btn" onclick="triggerShutdown()">🔒 請先消除此角色的所有威脅以解鎖撤離</button>
        </div>
    </div>

    <div id="overlay" class="overlay">
        <div class="modal">
            <h2 style="color: #34d399; margin-top:0; font-weight: 800;">💥 TACTICAL CLEAR</h2>
            <div id="modal-title" class="food-recommend"></div>
            <p id="modal-quote" class="quote"></p>
            <button class="close-btn" onclick="closeModal()">⚡「安全撤離，強制斷電！」</button>
        </div>
    </div>

    <script>
        const defaultTasks = {
            "ic": ["[⚔️核心突擊] 攻克大魔王所得稅，要怎麼調DTA/DTL", "[⚔️關鍵防線] 編製現金流量表，這科目怎麼還是有差啊", "[📡戰術指揮] 監控Staff特工部隊的查核進度"],
            "staff_usagi": ["[🐰銀行合併] 三家子公司沖銷=認準顏色分啊分", "[🐰創投] 都這做了一年了，「呀哈！」這簡單啦"],
            "staff_hachiware": ["[🐱三商救援] 我會回來玉山的！", "[🐱支援] 時不時來問候一下玉山的兄弟們"],
            "staff_mome": ["[🐢函證] 理解，我知道要怎麼快速發函證了！", "[🐿️心理防禦] 吃掉敵方零食"],
            "staff_kuhon": ["[🐷戰術整理] 關係人和不動產是我的第一門課", "[🐷物資跟進] 我接下來要幹嘛呢"],
            "manager": ["[👔戰術覆核] 我要先學會閉嘴下來做事了", "[👔外交斡旋] 客戶怎麼又來找我的好煩啊"],
            "partner": ["🌰 [最終簽核] 我要學會不龜毛不要下那麼多note", "🌰 [風險裁決] 我只要不龜毛就好了"]
        };
