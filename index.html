<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ E.SUN x 114Q2 x 特工部隊戰術控制台</title>
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: rgba(28, 37, 65, 0.6);
            --border-color: rgba(16, 185, 129, 0.25);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --esun-green: #10b981;
            --esun-glow: rgba(16, 185, 129, 0.4);
            --terminal-red: #f43f5e;
            --panel-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 24px 16px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.08) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 2;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
            padding: 20px 16px;
            background: linear-gradient(135deg, rgba(28, 37, 65, 0.8) 0%, rgba(11, 19, 43, 0.8) 100%);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--panel-shadow), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 8px 0;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
            background: linear-gradient(to right, #fff, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #a7f3d0;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .countdown-box {
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #fda4af;
            font-weight: 700;
            display: inline-block;
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.15);
        }

        /* 頂級職級大分類切換 */
        .level-selector {
            display: flex;
            background: rgba(11, 19, 43, 0.9);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 6px;
            border-radius: 16px;
            margin-bottom: 14px;
            gap: 6px;
            box-shadow: var(--panel-shadow);
        }

        .level-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 12px 0;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .level-btn.active {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: #fff;
            box-shadow: 0 4px 12px var(--esun-glow);
        }

        /* Staff 子角色切換 */
        .staff-sub-selector {
            display: flex;
            background: rgba(28, 37, 65, 0.4);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 4px;
            border-radius: 14px;
            margin-bottom: 18px;
            gap: 4px;
        }

        .staff-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 10px 0;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: all 0.2s;
        }

        .staff-btn:hover {
            color: #fff;
        }

        .staff-btn.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--esun-green);
            font-weight: 700;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        /* 特工補給專區 */
        .food-helper-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--panel-shadow);
        }

        .food-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #34d399;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .food-btn-group {
            display: flex;
            gap: 12px;
        }

        .food-action-btn {
            flex: 1;
            background: linear-gradient(135deg, rgba(58, 80, 107, 0.4) 0%, rgba(28, 37, 65, 0.6) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .food-action-btn:hover {
            border-color: var(--esun-green);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.15);
        }

        .food-result-display {
            margin-top: 12px;
            padding: 12px;
            background: rgba(11, 19, 43, 0.6);
            border-radius: 10px;
            font-size: 0.85rem;
            color: #e2e8f0;
            display: none;
            border-left: 4px solid var(--esun-green);
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
        }

        /* 進度條 */
        .progress-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: var(--panel-shadow);
        }

        .progress-text-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 10px;
        }

        #progress-percent {
            color: var(--esun-green);
            font-weight: 800;
            text-shadow: 0 0 8px var(--esun-glow);
        }

        .progress-bar-bg {
            background: #0b1329;
            height: 10px;
            width: 100%;
            border-radius: 999px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #10b981 0%, #34d399 100%);
            height: 100%;
            width: 0%;
            border-radius: 999px;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px var(--esun-glow);
        }

        /* 任務頒布區 */
        .input-section {
            background: rgba(11, 19, 43, 0.8);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 16px;
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            box-shadow: var(--panel-shadow);
        }

        .input-section input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .input-section input::placeholder {
            color: #64748b;
        }

        .add-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0 18px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .add-btn:hover {
            opacity: 0.9;
        }

        /* 待辦項目清單 */
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .todo-item {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 16px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--panel-shadow);
            transition: all 0.2s;
        }

        .todo-item:hover {
            border-color: rgba(16, 185, 129, 0.2);
            transform: translateX(2px);
        }

        .todo-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            cursor: pointer;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #475569;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            background: rgba(11, 19, 43, 0.4);
        }

        .todo-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #e2e8f0;
        }

        .todo-item.completed {
            border-color: rgba(255,255,255,0.02);
            background: rgba(28, 37, 65, 0.25);
        }

        .todo-item.completed .checkbox {
            background: #10b981;
            border-color: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
        }

        .todo-item.completed .checkbox::after {
            content: "✓";
            color: #fff;
            font-size: 0.85rem;
            font-weight: 900;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #64748b;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--terminal-red);
            cursor: pointer;
            opacity: 0.4;
            padding: 6px;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        .delete-btn:hover {
            opacity: 1;
        }

        /* 安全撤離按鈕 */
        .logout-btn {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255,255,255,0.05);
            color: #475569;
            padding: 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: not-allowed;
            width: 100%;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: var(--panel-shadow);
        }

        .logout-btn.ready {
            background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
            border: none;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
        }

        /* 彈出視窗 */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 19, 43, 0.95);
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(8px);
        }

        .modal {
            background: #1c2541;
            border: 1px solid var(--border-color);
            padding: 28px 24px;
            border-radius: 24px;
            max-width: 340px;
            width: 88%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .food-recommend {
            background: rgba(16, 185, 129, 0.1);
            padding: 12px;
            border-radius: 12px;
            margin: 16px 0;
            font-weight: 700;
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .quote {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .close-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--esun-glow);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚡ OPERATION E.SUN Q2</h1>
            <div class="subtitle">玉山Team特工部隊控制台</div>
            <div class="countdown-box" id="countdown-display">⏳ 距離 死線決戰：計算中...</div>
        </header>

        <div class="level-selector">
            <button class="level-btn active" id="lvl-ic" onclick="switchLevel('ic')">指揮官 吉伊 🐹</button>
            <button class="level-btn" id="lvl-staff" onclick="switchLevel('staff')">突擊前線 (Staff)</button>
            <button class="level-btn" id="lvl-manager" onclick="switchLevel('manager')">戰術參謀 🐰</button>
            <button class="level-btn" id="lvl-partner" onclick="switchLevel('partner')">最高統帥 🌰</button>
        </div>

        <div class="staff-sub-selector" id="staff-sub-box" style="display: none;">
            <button class="staff-btn active" data-staff="usagi" onclick="switchStaff('usagi')"><span>🐰</span><span>兔兔隊員</span></button>
            <button class="staff-btn" data-staff="hachiware" onclick="switchStaff('hachiware')"><span>🐱</span><span>小八隊員</span></button>
            <button class="staff-btn" data-staff="mome" onclick="switchStaff('mome')"><span>🐿️</span><span>小桃隊員</span></button>
            <button class="staff-btn" data-staff="kuhon" onclick="switchStaff('kuhon')"><span>🐷</span><span>古本屋隊員</span></button>
        </div>

        <div class="food-helper-box">
            <div class="food-title">📦 SECURE SUPPLY // 戰地物資補給庫</div>
            <div class="food-btn-group">
                <button class="food-action-btn" onclick="getRandomFood('lunch')">🥪 中午吃啥 (20款食物大庫)</button>
                <button class="food-action-btn" onclick="getRandomFood('drink')">🥤 下午茶 (20家手搖天團)</button>
            </div>
            <div id="food-result" class="food-result-display"></div>
        </div>

        <div class="progress-container">
            <div class="progress-text-row">
                <span id="progress-role-label">載入代號中...</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <div class="input-section">
            <input type="text" id="todo-input" placeholder="[指揮官權限] 頒布今晚特工行動..." onkeypress="handleKeyPress(event)">
            <button class="add-btn" onclick="addTodo()">頒布</button>
        </div>

        <div class="todo-list" id="todo-list"></div>

        <div class="logout-section">
            <button class="logout-btn" id="shutdown-btn" onclick="triggerShutdown()">🔒 解鎖安全關機撤離 (0%)</button>
        </div>
    </div>

    <div id="overlay" class="overlay">
        <div class="modal">
            <h2 style="color: #34d399; margin-top:0; font-weight: 800;">💥 TACTICAL CLEAR</h2>
            <div id="modal-title" class="food-recommend"></div>
            <p id="modal-quote" class="quote"></p>
            <button class="close-btn" onclick="closeModal()">⚡「安全撤離，強制斷電！」</button>
        </div>
    </div>

    <script>
        // 特工行動原始設定集
        const defaultTasks = {
            "ic": ["[⚔️核心突擊] 攻克大魔王所得稅，要怎麼調DTA/DTL", "[⚔️關鍵防線] 編製現金流量表，這科目怎麼還是有差啊", "[📡戰術指揮] 監控Staff特工部隊的查核進度"],
            "staff_usagi": ["[🐰銀行合併] 三家子公司沖銷=認準顏色分啊分", "[🐰創投] 都這做了一年了，「呀哈！」這簡單啦"],
            "staff_hachiware": ["[🐱三商救援] 我會回來玉山的！", "[🐱支援] 時不時來問候一下玉山的兄弟們"],
            "staff_mome": ["[🐢函證] 理解，我知道要怎麼快速發函證了！", "[🐿️心理防禦] 吃掉敵方零食"],
            "staff_kuhon": ["[🐷戰術整理] 關係人和不動產是我的第一門課", "[🐷物資跟進] 我接下來要幹嘛呢"],
            "manager": ["[👔戰術覆核] 我要先學會閉嘴下來做事了", "[👔外交斡旋] 客戶怎麼又來找我了好煩啊"],
            "partner": ["🌰 [最終簽核] 我要學會不龜毛不要下那麼多note", "🌰 [風險裁決] 我只要不龜毛就好了"]
        };

        const roleMeta = {
            "ic": { name: "指揮官 吉伊卡哇 🐹", done: "哇…（流淚）！所得稅與現金流量表全數平齊！指揮官吉伊卡哇今晚頂住死線壓力，討伐大成功！全體安全撤離，立刻躲進被窩強制斷電！" },
            "staff_usagi": { name: "突擊特工 兔兔 🐰", done: "烏拉！！！呀哈！！！兔兔特工以風捲殘雲之勢解決了所有創投和銀行底稿！現在立刻拋下武器，全速奔跑回家強制關機！" },
            "staff_hachiware": { name: "醫護特工 小八貓 🐱", done: "「總會有辦法的！」小八隊員會回到玉山！底稿全數歸零，快放下滑鼠，喝碗熱湯好好睡一覺吧！" },
            "staff_mome": { name: "偽裝特工 小桃鼠 🐿️", done: "哼哼～小桃特工出馬，沒有搞不定的底稿！本少爺現在下達最高指令：立刻撤離下班，強制關機！" },
            "staff_kuhon": { name: "後勤特工 古本屋 🐷", done: "防線整理完畢！古本屋隊員默默把所有繁雜底稿歸檔得完美無瑕！辛苦了，快強制斷電休息去！" },
            "manager": { name: "戰術參謀 經理 🐰", done: "經理參謀辛苦了！防線防守成功，Q2 風暴順利解除，現在馬上跟著兔兔隊員一起快樂斷電下班！" },
            "partner": { name: "最高統帥 栗子饅頭 🌰", done: "哈啊——！（吐氣）報告簽核完畢！今晚最完美的特工配置就是立刻撤離，回去享受大叔般的深夜安穩睡眠！" }
        };

        // 擴充戰地物資庫：各 20 個經典選擇
        const foodDatabase = {
            lunch: [
                "🏪 7-11（極速應援！國民便當/御飯糰/關東煮/微波燴飯，快速回基地補給）",
                "🏪 全家（便利續命！夯番薯/微波義大利麵/健康美膳餐盒，省時首選）",
                "🍜 熱騰騰雞塊麵（炸雞塊配爽口湯麵，辦公室最抗壓的邪惡組合）",
                "🍢 罪惡大滷味（自由挑選蔬菜與各式火鍋料，強烈建議加辣破壞疲勞）",
                "🥗 少油低卡健康餐盒（水煮雞胸肉/烤鮭魚/紫米飯，維持高強度作戰腦力）",
                "🍛 濃郁系咖哩飯（厚實醬汁配炸豬排或唐揚雞，查核空檔的精神支柱）",
                "🥟 爆汁鍋貼水餃（快狠準高熱量，特工最速補給方案）",
                "🍱 經典排骨/雞腿便當（老字號配菜扎實，應付爆肝下午的熱量地基）
                "🍔 美式漢堡炸雞套餐（香脆多汁薯條，死線前的靈魂救贖）",
                "🍣 壽司生魚片丼飯（清爽無負擔，避免下午開會全體打瞌睡）",
                "🍜 日式拉麵/烏龍麵（濃郁豚骨湯頭，溫暖被查核折磨的胃）",
                "🍲 台式個人小火鍋（熱湯滾滾，深夜民生東路小確幸）",
                "🥪 精緻總匯三司/輕食沙拉（適合需要一邊敲鍵盤、一邊單手進食的危急時刻）",
                "🍖 韓式炸雞便當（甜辣脆皮，用重口味麻痺對不平的現金流量表）",
                "🥣 鮮美清鯛魚湯/魚肉粥（清湯修復清香甘甜，加班熬夜的溫和防線）",
                "🥩 鐵板現炒牛/豬肉便當（香氣四溢，用大火鑊氣燃燒作戰鬥志）",
                "🫓 炭烤燒餅油條/胡椒餅（傳統扎實麵香，極速外帶的點心式午餐）",
                "🍝 義式培根雙醬麵（滿滿起司與醬汁，提供碳水化合物大補給）",
                "🍚 港式燒臘便當（三寶飯油雞脆皮燒肉，高效率的極品肉食補充）",
                "🦐 泰式酸辣打拋豬飯（酸辣開胃，一秒擊碎昏昏欲睡的盛夏查核午後）"
            ],
            drink: [
                "🧋 50嵐（經典1號四季春珍波椰，大杯微糖微冰是辦公室底標產物）",
                "🥤 得正 Oolong Tea（特工激推！烘焙烏龍茶底加嫩仙草/茶凍，續命神物）",
                "🧋 可不可熟成紅茶（熟成歐蕾/胭脂紅茶，香氣濃郁，麻痺數字痛苦）",
                "🍵 烏弄 UNOCHA（金萱冬片無糖加杏仁凍，清爽回甘無負擔）",
                "🍼 約翰紅茶公司（煮濃那鐵/雨果那鐵，頂級乳香治癒高壓心靈）",
                "🍇 麻古茶坊（高山金萱茶/楊枝甘露/芝芝果粒，快樂多酚大暴走）",
                "🥛 迷客夏 Milksha（珍珠手炒黑糖鮮奶/大甲芋頭鮮奶，醇厚乳香）",
                "🍼 五桐號 WooTea（五桐茶加杏仁凍/青茶凍，復古茶香超順口）
                "🍋 大苑子（翡翠檸檬/新鮮水果茶，滿滿維他命C保持神經高度清醒）",
                "🧋 珍煮丹（黑糖珍珠鮮奶，濃郁古法黑糖，瞬間拉滿體力值）",
                "🥤 清心福全（優多綠茶/隱藏版版多多綠，老字號極速外送保證）",
                "🍵 一芳水果茶（溪口甘蔗青茶/水果茶，台式傳統抗壓古早味）",
                "🧋 八曜和茶（和風乳茶/柚香覺醒，極致穀物茶清爽不卡頭）",
                "🥛 龜記茗品（紅柚翡翠/三韻紅萱，果茶控特工的指定空投款）",
                "🥤 萬波島嶼紅茶（紅豆粉粿鮮奶/蘭葉那堤，滿滿嚼勁的台式點心飲）",
                "🍵 鶴茶樓（鶴頂紅茶/思鶴熟成奶茶，耐喝不膩的特工首選）",
                "🥤 飲弄 / 茶湯會（鐵觀音拿鐵，濃郁炭焙茶香，強效提神）",
                "🍋 先喝道（英式水果茶/蜜桃風味茶，皇家典雅風化解緊繃氣氛）",
                "🧋 貢茶 Gong cha（奶蓋綠茶/珍珠奶茶，國際連鎖標準化穩定品質）",
                "🥛 叮哥茶飲（洛神花茶/紅豆奶茶，偶爾換換口味的驚喜特調補給）"
            ]
        };

        let currentLevel = localStorage.getItem("tg_lvl") || "ic"; 
        let currentStaff = localStorage.getItem("tg_stf") || "usagi"; 
        let allTodos = JSON.parse(localStorage.getItem("tg_todos_v6")) || {};

        function getActiveKey() {
            return currentLevel === "staff" ? `staff_${currentStaff}` : currentLevel;
        }

        if (Object.keys(allTodos).length === 0) {
            Object.keys(defaultTasks).forEach(k => {
                allTodos[k] = defaultTasks[k].map(t => ({ text: t, completed: false }));
            });
        }

        function switchLevel(lvl) {
            currentLevel = lvl;
            localStorage.setItem("tg_lvl", lvl);
            
            document.querySelectorAll(".level-btn").forEach(b => b.classList.remove("active"));
            document.getElementById(`lvl-${lvl}`).classList.add("active");

            const staffBox = document.getElementById("staff-sub-box");
            if (lvl === "staff") {
                staffBox.style.display = "flex";
            } else {
                staffBox.style.display = "none";
            }
            
            document.getElementById("food-result").style.display = "none";
            render();
        }

        function switchStaff(stf) {
            currentStaff = stf;
            localStorage.setItem("tg_stf", stf);
            
            document.querySelectorAll(".staff-btn").forEach(b => b.classList.remove("active"));
            const btn = document.querySelector(`.staff-btn[data-staff="${stf}"]`);
            if (btn) btn.classList.add("active");
            
            document.getElementById("food-result").style.display = "none";
            render();
        }

        function updateProgress() {
            const key = getActiveKey();
            const list = allTodos[key] || [];
            const total = list.length;
            const done = list.filter(t => t.completed).length;
            const pct = total === 0 ? 0 : Math.round((done / total) * 100);

            document.getElementById("progress-role-label").innerText = `⚡ ${roleMeta[key].name} // 行動達成度`;
            document.getElementById("progress-percent").innerText = `${pct}%`;
            document.getElementById("progress-fill").style.width = `${pct}%`;

            const btn = document.getElementById("shutdown-btn");
            if (pct === 100 && total > 0) {
                btn.classList.add("ready");
                btn.innerText = "💥 ACTION COMPLETE // 解鎖安全關機撤離";
                btn.disabled = false;
            } else {
                btn.classList.remove("ready");
                btn.innerText = `🔒 請先消除所有威脅項目以解鎖撤離 (${done}/${total})`;
                btn.disabled = true;
            }
        }

        function render() {
            const key = getActiveKey();
            const listEl = document.getElementById("todo-list");
            listEl.innerHTML = "";
            const list = allTodos[key] || [];

            list.forEach((todo, idx) => {
                const item = document.createElement("div");
                item.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                item.innerHTML = `
                    <div class="todo-left" onclick="toggleTodo(${idx})">
                        <div class="checkbox"></div>
                        <div class="todo-text">${todo.text}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteTodo(${idx})">✕</button>
                `;
                listEl.appendChild(item);
            });

            localStorage.setItem("tg_todos_v6", JSON.stringify(allTodos));
            updateProgress();
        }

        function addTodo() {
            const input = document.getElementById("todo-input");
            const text = input.value.trim();
            if (text) {
                const key = getActiveKey();
                allTodos[key].unshift({ text: `[${roleMeta[key].name.split(' ')[1]}任務] ${text}`, completed: false });
                input.value = "";
                render();
            }
        }

        function handleKeyPress(e) { if (e.key === "Enter") addTodo(); }
        function toggleTodo(idx) { const key = getActiveKey(); allTodos[key][idx].completed = !allTodos[key][idx].completed; render(); }
        function deleteTodo(idx) { const key = getActiveKey(); allTodos[key].splice(idx, 1); render(); }

        function getRandomFood(type) {
            const list = foodDatabase[type];
            const res = list[Math.floor(Math.random() * list.length)];
            const el = document.getElementById("food-result");
            el.style.display = "block";
            el.innerHTML = type === 'lunch' ? `📦 <b>戰地物資隨機雷達：</b><br>${res}` : `🥤 <b>空投手搖隨機雷達：</b><br>${res}`;
        }

        function updateCountdown() {
            const target = new Date("2026-08-14T00:00:00+08:00");
            const diff = target - new Date();
            if (diff <= 0) {
                document.getElementById("countdown-display").innerText = "💥 ACTION COMPLETE // 突擊日已到，全員撤離！";
                return;
            }
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff % 86400000) / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            document.getElementById("countdown-display").innerText = `⏳ 距離 8/14 死線決戰：${d} 天 ${h} 小時 ${m} 分`;
        }

        function triggerShutdown() {
            const key = getActiveKey();
            document.getElementById("modal-title").innerText = `💥 代號 [${roleMeta[key].name}] 任務全清空！`;
            document.getElementById("modal-quote").innerText = roleMeta[key].done;
            document.getElementById("overlay").style.display = "flex";
        }
        function closeModal() { document.getElementById("overlay").style.display = "none"; }

        document.addEventListener("DOMContentLoaded", () => {
            switchLevel(currentLevel);
            if (currentLevel === "staff") switchStaff(currentStaff);
            setInterval(updateCountdown, 60000);
            updateCountdown();
        });
    </script>
</body>
</html>
