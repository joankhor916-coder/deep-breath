<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💚 E.SUN Workspace</title>
    <style>
        :root {
            --bg-color: #060a12;
            --card-bg: rgba(15, 23, 42, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --esun-green: #10b981;
            --esun-glow: rgba(16, 185, 129, 0.25);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            margin: 0;
            padding: 24px 16px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* 翡翠極光背景 */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 80% 20%, rgba(16, 185, 129, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 2;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 6px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1.05rem;
            color: var(--esun-green);
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        /* 倒數計時器樣式 */
        .countdown-box {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.2);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            color: #34d399;
            font-weight: 700;
            display: inline-block;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* 職位切換橫條（加入會計師） */
        .role-selector {
            display: flex;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            padding: 4px;
            border-radius: 16px;
            margin-bottom: 20px;
            gap: 4px;
        }

        .role-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 12px 2px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .role-btn.active {
            background: var(--esun-green);
            color: #042f1a;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        /* 進度條外殼 */
        .progress-container {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .progress-text-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 8px;
        }

        #progress-percent {
            color: var(--esun-green);
            font-weight: 700;
        }

        .progress-bar-bg {
            background: #1e293b;
            height: 10px;
            width: 100%;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background: var(--esun-green);
            height: 100%;
            width: 0%;
            border-radius: 999px;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px var(--esun-glow);
        }

        /* 輸入框區塊 */
        .input-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 20px;
            display: flex;
            gap: 10px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 24px;
        }

        .input-section input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.15rem;
            padding: 8px 12px;
            outline: none;
        }

        .input-section input::placeholder {
            color: #475569;
        }

        .add-btn {
            background: var(--esun-green);
            color: #042f1a;
            border: none;
            border-radius: 14px;
            padding: 0 20px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* 列表區塊 */
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }

        .todo-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px 18px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .todo-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
        }

        .checkbox {
            width: 26px;
            height: 26px;
            border: 2px solid #475569;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .todo-text {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-main);
            line-height: 1.4;
        }

        .todo-item.completed {
            border-color: rgba(16, 185, 129, 0.15);
            background: rgba(15, 23, 42, 0.35);
            opacity: 0.5;
        }

        .todo-item.completed .checkbox {
            background: var(--esun-green);
            border-color: var(--esun-green);
        }

        .todo-item.completed .checkbox::after {
            content: "✓";
            color: #042f1a;
            font-size: 1.1rem;
            font-weight: 900;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-sub);
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 8px;
            opacity: 0.4;
        }

        .logout-section {
            text-align: center;
            margin-top: 40px;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            padding: 18px 32px;
            border-radius: 22px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.15);
        }

        /* 彈出視窗 */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 10, 19, 0.97);
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            animation: fadeIn 0.25s ease;
        }

        .modal {
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.12);
            padding: 36px 28px;
            border-radius: 32px;
            max-width: 360px;
            width: 88%;
            text-align: center;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8);
            animation: slideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal h2 {
            color: #fca5a5;
            font-size: 1.5rem;
            margin-top: 0;
            font-weight: 700;
        }

        .food-recommend {
            background: linear-gradient(135deg, rgba(16,185,129,0.18) 0%, rgba(16,185,129,0.03) 100%);
            padding: 18px;
            border-radius: 18px;
            margin: 24px 0;
            font-weight: 700;
            color: #34d399;
            font-size: 1.25rem;
            border: 1px solid rgba(16,185,129,0.25);
            line-height: 1.4;
        }

        .quote {
            font-size: 1.1rem;
            color: #cbd5e1;
            line-height: 1.8;
            margin-bottom: 32px;
            text-align: justify;
        }

        .close-btn {
            background: #f8fafc;
            color: #0f172a;
            border: none;
            padding: 18px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            font-size: 1.1rem;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div class="aurora-bg"></div>

    <div class="container">
        <header>
            <h1>💚 E.SUN Workspace</h1>
            <div class="subtitle">玉山集團 115Q2 · 深夜戰術檯</div>
            <!-- 倒數計時區 -->
            <div class="countdown-box" id="countdown-display">⏳ 距離 8/14 報告日：計算中...</div>
        </header>

        <!-- 職位一鍵切換列（加入會計師） -->
        <div class="role-selector">
            <button class="role-btn active" data-role="ic" onclick="switchRole('ic')">IC</button>
            <button class="role-btn" data-role="staff" onclick="switchRole('staff')">Staff</button>
            <button class="role-btn" data-role="manager" onclick="switchRole('manager')">經理</button>
            <button class="role-btn" data-role="partner" onclick="switchRole('partner')">會計師</button>
        </div>

        <!-- 實時任務進度條 -->
        <div class="progress-container">
            <div class="progress-text-row">
                <span>當前職級任務完成度</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <div class="input-section">
            <input type="text" id="todo-input" placeholder="新增今晚必做查核項目..." onkeypress="handleKeyPress(event)">
            <button class="add-btn" onclick="addTodo()">新增</button>
        </div>

        <div class="todo-list" id="todo-list"></div>

        <div class="logout-section">
            <button class="logout-btn" onclick="triggerShutdown()">⚠️ 大腦強制關機登出</button>
        </div>
    </div>

    <div id="overlay" class="overlay">
        <div class="modal">
            <h2>大腦關機 · 系統登出成功</h2>
            <div id="modal-food" class="food-recommend">推薦補給品載入中...</div>
            <p id="modal-quote" class="quote">碎碎念載入中...</p>
            <button class="close-btn" onclick="closeModal()">收到底稿，現在關機睡覺</button>
        </div>
    </div>

    <script>
        // 包含會計師的預設核心清單
        const roleTasks = {
            ic: [
                "所得稅：核對 DTA/DTL 計算底稿與稅率調整差異",
                "貼現及放款：複核 ECL 減損計提與大額曝險分類",
                "現金流量表：勾稽直接法與間接法落差數字",
                "IC 職責：確認 Staff 底稿 review 進度與經理 mail 彙整"
            ],
            staff: [
                "現金及約當現金：核對玉山銀行期末存款詢證函與對帳單",
                "貼現及放款：拉取傳票進行抽樣，確認利息收入與授信借款合約",
                "基本查核：完成放款大戶基本資料、營業活動資產負債變動明細"
            ],
            manager: [
                "進度督導：審查 IC 送出之 115Q2 核心科目重大調整",
                "客戶溝通：與玉山窗口協調未送達之詢證函與財報揭露細項",
                "風險控制：全面評估本季貼現放款之備抵呆帳提列合理性"
            ],
            partner: [
                "最終簽核：覆核經理與 IC 提報之 115Q2 玉山財報與重要揭露",
                "策略複核：針對重大放款 ECL 減損提列與所得稅差異進行最後指導",
                "客戶溝通：與玉山高層、審計委員會進行審計結果關鍵溝通"
            ]
        };

        const shutdownSupplies = [
            { food: "🍢 超商關東煮：熱湯 + 溫熱大根", quote: "115Q2 的玉山案件帳很大、很雜，但今晚你的進度已經做得很棒了。不管是調不平的現金流量表、還是對不完的放款，現在全部留在辦公室。去超商盛碗熱湯，暖暖胃，這才是今晚最迫切的資產配置。" },
            { food: "🥛 溫熱燕麥奶 或 低咖啡因熱拿鐵", quote: "大魔王所得稅的遞延資產負債公式、還有複雜的詢證函是不是在腦袋裡打轉？身為玉山案件的一員，你頂著高壓運轉一整天，大腦該進行負載平衡了。喝杯熱奶，把數字開關切斷，好好睡一覺。" },
            { food: "🍫 2片微甜黑巧克力 + 溫開水", quote: "下班從信義區或民生東路走出來，台北深夜的夜風特別冷清。每個人都盯著進度，但只有此時舌尖融化的黑巧克力懂你的辛苦。別想財報永久性差異或底稿了，吞下這口甜，今天你已經對得起所有人了。" },
            { food: "🥣 鮮美溫熱的清鯛魚湯 或 蛤蜊湯", quote: "撐過了高強度的查核大戰，胃需要溫柔的修復。不要吃油膩宵夜，來碗清鮮熱湯。115Q2 的死線明天再說，今晚你的靈魂要點擊登出，好好睡一覺，辛苦了！" }
        ];

        let currentRole = localStorage.getItem("esun_current_role") || "ic";
        let allRoleTodos = JSON.parse(localStorage.getItem("esun_all_todos")) || {};

        // 如果快取中沒有 partner，或者結構需要更新，重新初始化
        if (!allRoleTodos.partner) {
            allRoleTodos = {};
        }

        if (Object.keys(allRoleTodos).length === 0) {
            Object.keys(roleTasks).forEach(role => {
                allRoleTodos[role] = roleTasks[role].map(task => ({ text: task, completed: false }));
            });
        }

        // 計算並更新進度條
        function updateProgressBar() {
            const todos = allRoleTodos[currentRole] || [];
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            
            let percent = total === 0 ? 0 : Math.round((completed / total) * 100);
            
            document.getElementById("progress-percent").innerText = `${percent}%`;
            document.getElementById("progress-fill").style.width = `${percent}%`;
        }

        function renderTodos() {
            const listEl = document.getElementById("todo-list");
            listEl.innerHTML = "";
            const todos = allRoleTodos[currentRole] || [];

            todos.forEach((todo, index) => {
                const item = document.createElement("div");
                item.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                item.innerHTML = `
                    <div class="todo-left" onclick="toggleTodo(${index})">
                        <div class="checkbox"></div>
                        <div class="todo-text">${todo.text}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteTodo(${index})">✕</button>
                `;
                listEl.appendChild(item);
            });
            localStorage.setItem("esun_all_todos", JSON.stringify(allRoleTodos));
            updateProgressBar();
        }

        function switchRole(role) {
            currentRole = role;
            localStorage.setItem("esun_current_role", role);
            
            document.querySelectorAll(".role-btn").forEach(btn => btn.classList.remove("active"));
            
            if (window.event && window.event.target && window.event.target.classList.contains("role-btn")) {
                window.event.target.classList.add("active");
            } else {
                const activeBtn = document.querySelector(`.role-btn[data-role="${role}"]`);
                if (activeBtn) activeBtn.classList.add("active");
            }
            renderTodos();
        }

        function addTodo() {
            const input = document.getElementById("todo-input");
            const text = input.value.trim();
            if (text) {
                allRoleTodos[currentRole].unshift({ text: text, completed: false });
                input.value = "";
                renderTodos();
            }
        }

        function handleKeyPress(e) { if (e.key === "Enter") addTodo(); }
        
        function toggleTodo(index) { 
            allRoleTodos[currentRole][index].completed = !allRoleTodos[currentRole][index].completed; 
            renderTodos(); 
        }
        
        function deleteTodo(index) { 
            allRoleTodos[currentRole].splice(index, 1); 
            renderTodos(); 
        }

        // 8/14 報告日倒數功能
        function updateCountdown() {
            const targetDate = new Date("2026-08-14T00:00:00+08:00");
            const now = new Date();
            const timeDiff = targetDate - now;

            if (timeDiff <= 0) {
                document.getElementById("countdown-display").innerText = "🎉 8/14 報告日已到！大功告成！";
                return;
            }

            const days = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));

            document.getElementById("countdown-display").innerText = `⏳ 距離 8/14 報告日：${days} 天 ${hours} 小時 ${mins} 分`;
        }

        function triggerShutdown() {
            const randomIndex = Math.floor(Math.random() * shutdownSupplies.length);
            const supply = shutdownSupplies[randomIndex];
            document.getElementById("modal-food").innerText = "☕️ 深夜推薦資產：\n" + supply.food;
            document.getElementById("modal-quote").innerText = supply.quote;
            document.getElementById("overlay").style.display = "flex";
        }

        function closeModal() { document.getElementById("overlay").style.display = "none"; }

        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll(".role-btn").forEach(btn => {
                if (btn.getAttribute("data-role") === currentRole) {
                    btn.classList.add("active");
                } else {
                    btn.classList.remove("active");
                }
            });
            renderTodos();
            updateCountdown();
            // 每分鐘更新一次倒數計時
            setInterval(updateCountdown, 60000);
        });
    </script>
</body>
</html>
