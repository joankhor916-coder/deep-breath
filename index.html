<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ E.SUN x 114Q2 x 特工部隊戰術控制台</title>
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: rgba(28, 37, 65, 0.6);
            --border-color: rgba(16, 185, 129, 0.25);
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --esun-green: #10b981;
            --esun-glow: rgba(16, 185, 129, 0.4);
            --terminal-red: #f43f5e;
            --panel-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 24px 16px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(16, 185, 129, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.08) 0px, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 2;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
            padding: 20px 16px;
            background: linear-gradient(135deg, rgba(28, 37, 65, 0.8) 0%, rgba(11, 19, 43, 0.8) 100%);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--panel-shadow), inset 0 1px 0 rgba(255,255,255,0.05);
        }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 8px 0;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
            background: linear-gradient(to right, #fff, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #a7f3d0;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .countdown-box {
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #fda4af;
            font-weight: 700;
            display: inline-block;
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.15);
            line-height: 1.4;
        }

        /* 頂級職級大分類切換 */
        .level-selector {
            display: flex;
            background: rgba(11, 19, 43, 0.9);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 6px;
