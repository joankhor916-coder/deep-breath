<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ E.SUN x Chiikawa 特工部隊戰術控制台</title>
    <style>
        :root {
            --bg-color: #020617;
            --card-bg: rgba(15, 23, 42, 0.8);
            --border-color: rgba(16, 185, 129, 0.2);
            --text-main: #f8fafc;
            --text-sub: #64748b;
            --esun-green: #10b981;
            --esun-glow: rgba(16, 185, 129, 0.4);
            --terminal-red: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace, -apple-system, sans-serif;
            margin: 0;
            padding: 24px 16px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 50% 10%, rgba(16, 185, 129, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 10% 90%, rgba(239, 68, 68, 0.05) 0%, transparent 40%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 2;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            padding: 16px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 12px;
            box-shadow: 0 0 15px var(--esun-glow);
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 6px 0;
            font-weight: 700;
            color: var(--esun-green);
            text-shadow: 0 0 8px var(--esun-glow);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #cbd5e1;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .countdown-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #fca5a5;
            font-weight: 700;
            display: inline-block;
        }

        /* 職級大分類切換 */
        .level-selector {
            display: flex;
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 12px;
            gap: 4px;
        }

        .level-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 10px 0;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .level-btn.active {
            background: rgba(16, 185, 129, 0.2);
            color: var(--esun-green);
            border: 1px solid var(--esun-green);
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }

        /* Staff 子角色切換 */
        .staff-sub-selector {
            display: flex;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 16px;
            gap: 4px;
        }

        .staff-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-sub);
            padding: 8px 0;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .staff-btn.active {
            background: var(--esun-green);
            color: #020617;
            font-weight: 700;
        }

        /* 物資補給專區 */
        .food-helper-box {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 20px;
        }

        .food-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--esun-green);
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .food-btn-group {
            display: flex;
            gap: 10px;
        }

        .food-action-btn {
            flex: 1;
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #e2e8f0;
            padding: 8px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .food-action-btn:hover {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--esun-green);
        }

        .food-result-display {
            margin-top: 10px;
            padding: 10px;
            background: #020617;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #cbd5e1;
            display: none;
            border-left: 3px solid var(--esun-green);
            line-height: 1.4;
        }

        /* 進度條 */
        .progress-container {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 20px;
        }

        .progress-text-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        #progress-percent {
            color: var(--esun-green);
            font-weight: 700;
        }

        .progress-bar-bg {
            background: #020617;
            height: 8px;
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .progress-bar-fill {
            background: var(--esun-green);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
            box-shadow: 0 0 8px var(--esun-glow);
        }

        /* 任務頒布區 */
        .input-section {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 12px;
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-section input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.95rem;
            padding: 6px;
            outline: none;
            font-family: inherit;
        }

        .input-section input::placeholder {
            color: #475569;
        }

        .add-btn {
            background: var(--esun-green);
            color: #020617;
            border: none;
            border-radius: 8px;
            padding: 0 16px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
        }

        /* 待辦項目 */
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }

        .todo-item {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .todo-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid #475569;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .todo-text {
            font-size: 0.95rem;
            line-height: 1.4;
            color: #e2e8f0;
        }

        .todo-item.completed {
            border-color: rgba(16, 185, 129, 0.1);
            background: rgba(15, 23, 42, 0.3);
        }

        .todo-item.completed .checkbox {
            background: var(--esun-green);
            border-color: var(--esun-green);
        }

        .todo-item.completed .checkbox::after {
            content: "✓";
            color: #020617;
            font-size: 0.85rem;
            font-weight: 900;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #475569;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--terminal-red);
            cursor: pointer;
            opacity: 0.5;
            padding: 4px 8px;
            font-family: inherit;
        }

        /* 強制解鎖關機 */
        .logout-btn {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255,255,255,0.05);
            color: #475569;
            padding: 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: not-allowed;
            width: 100%;
            font-family: inherit;
            letter-spacing: 1px;
        }

        .logout-btn.ready {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--terminal-red);
            color: #fca5a5;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }

        /* 彈出視窗 */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.98);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .modal {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 16px;
            max-width: 340px;
            width: 88%;
            text-align: center;
            box-shadow: 0 0 30px var(--esun-glow);
        }

        .food-recommend {
            background: rgba(16, 185, 129, 0.1);
            padding: 12px;
            border-radius: 8px;
            margin: 16px 0;
            font-weight: 700;
            color: var(--esun-green);
            border: 1px solid var(--border-color);
        }

        .quote {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: justify;
        }

        .close-btn {
            background: var(--esun-green);
            color: #020617;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            width: 100%;
            font-family: inherit;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="aurora-bg"></div>

    <div class="container">
        <header>
            <h1>⚡ OPERATION E.SUN Q2</h1>
            <div class="subtitle">玉山營業部 · 特工部隊行動控制台</div>
            <div class="countdown-box" id="countdown-display">⏳ 距離 8/14 死線突擊：計算中...</div>
        </header>

        <!-- 第一層：部隊編制切換 -->
        <div class="level-selector">
            <button class="level-btn active" id="lvl-ic" onclick="switchLevel('ic')">指揮官 吉伊 🐹</button>
            <button class="level-btn" id="lvl-staff" onclick="switchLevel('staff')">突擊前線 (Staff)</button>
            <button class="level-btn" id="lvl-manager" onclick="switchLevel('manager')">戰術參謀 🐰</button>
            <button class="level-btn" id="lvl-partner" onclick="switchLevel('partner')">統帥 栗子 🌰</button>
        </div>

        <!-- 第二層：突擊前線部隊代號 -->
        <div class="staff-sub-selector" id="staff-sub-box" style="display: none;">
            <button class="staff-btn active" data-staff="usagi" onclick="switchStaff('usagi')"><span>🐰</span><span>兔兔隊員</span></button>
            <button class="staff-btn" data-staff="hachiware" onclick="switchStaff('hachiware')"><span>🐱</span><span>小八隊員</span></button>
            <button class="staff-btn" data-staff="mome" onclick="switchStaff('mome')"><span>🐿️</span><span>小桃隊員</span></button>
            <button class="staff-btn" data-staff="kuhon" onclick="switchStaff('kuhon')"><span>🐷</span><span>古本屋隊員</span></button>
        </div>

        <!-- 特工補給專區 -->
        <div class="food-helper-box">
            <div class="food-title">📡 SECURE SUPPLY // 民生東路三段物資補給</div>
            <div class="food-btn-group">
                <button class="food-action-btn" onclick="getRandomFood('lunch')">🏃‍♂️ 戰地極速外帶 (中午)</button>
                <button class="food-action-btn" onclick="getRandomFood('drink')">📱 空投續命手搖 (下午)</button>
            </div>
            <div id="food-result" class="food-result-display"></div>
        </div>

        <!-- 任務解鎖進度 -->
        <div class="progress-container">
            <div class="progress-text-row">
                <span id="progress-role-label">載入代號中...</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <!-- 指揮官任務頒布區 -->
        <div class="input-section">
            <input type="text" id="todo-input" placeholder="[指揮官權限] 頒布今晚特工行動..." onkeypress="handleKeyPress(event)">
            <button class="add-btn" onclick="addTodo()">頒布</button>
        </div>

        <!-- 行動任務清單 -->
        <div class="todo-list" id="todo-list"></div>

        <!-- 強制撤離登出 -->
        <div class="logout-section">
            <button class="logout-btn" id="shutdown-btn" onclick="triggerShutdown()">🔒 解鎖安全關機撤離 (0%)</button>
        </div>
    </div>

    <!-- 行動回報彈出視窗 -->
    <div id="overlay" class="overlay">
        <div class="modal">
            <h2 style="color: var(--esun-green); margin-top:0;">💥 TACTICAL CLEAR // 討伐成功</h2>
            <div id="modal-title" class="food-recommend"></div>
            <p id="modal-quote" class="quote"></p>
            <button class="close-btn" onclick="closeModal()">⚡「哇…（安全撤離，強制斷電！）」</button>
        </div>
    </div>

    <script>
        // 特工行動原始設定集
        const defaultTasks = {
            "ic": ["[⚔️核心突擊] 攻克大魔王所得稅模組，核對 DTA/DTL 調整差異", "[⚔️關鍵防線] 編製現金流量表，絕對勾稽平齊直接法與間接法落差", "[📡戰術指揮] 監控前線 Staff 特工部隊的底稿查核進度"],
            "staff_usagi": ["[🏃‍♂️極速抽樣] 配合火網掩護，以烏拉的速度將全部放款傳票抽調完畢", "[🏃‍♂️金流攻佔] 點收期末對帳單，核對完畢發出「呀哈！」的勝利咆哮"],
            "staff_hachiware": ["[🐱戰地救援] 溫柔跟催詢證函回函進度，並將敵情完整掃描建檔", "[🐱後勤支援] 安撫與掩護旁邊因為數字對不起來在流淚的同袍"],
            "staff_mome": ["[🐿️情報美化] 執行底稿視覺偽裝，將排版調整至最完美、最可愛程度", "[🐿️心理防禦] 吃掉敵方零食，用可愛的微笑化解長官查堂的加班氣壓"],
            "staff_kuhon": ["[🐷戰術整理] 默默將後方雜亂的傳票分門別類，排成整齊的防衛陣形", "[🐷物資跟進] 監控並準備好下午茶的空投 UberEats 訂單清單"],
            "manager": ["[👔戰術覆核] 審查由指揮官吉伊卡哇提交的重大調整科目底稿", "[👔外交斡旋] 親自與玉山高層窗口通話，強攻突擊尚未收回的大額詢證函"],
            "partner": ["🌰 [最終簽核] 於 115Q2 玉山財報核閱報告上簽署最高統帥印鑑", "🌰 [風險裁決] 針對大額貼現與放款之 ECL 呆帳提列發動最終核准指令"]
        };

        const roleMeta = {
            "ic": { name: "指揮官 吉伊卡哇 🐹", done: "哇…（流淚）！所得稅與現金流量表全數平齊！指揮官吉伊卡哇今晚頂住死線壓力，討伐大成功！全體安全撤離，立刻躲進被窩強制斷電！" },
            "staff_usagi": { name: "突擊特工 兔兔 🐰", done: "烏拉！！！呀哈！！！兔兔特工以風捲殘雲之勢解決了所有傳票抽樣！現在立刻拋下武器，全速奔跑回家強制關機！" },
            "staff_hachiware": { name: "醫護特工 小八貓 🐱", done: "「總會有辦法的！」小八隊員完美守住後勤！底稿全數歸零，快放下滑鼠，喝碗熱湯好好睡一覺吧！" },
            "staff_mome": { name: "偽裝特工 小桃鼠 🐿️", done: "哼哼～小桃特工出馬，沒有搞不定的底稿！本公主現在下達最高指令：立刻撤離下班，強制關機！" },
            "staff_kuhon": { name: "後勤特工 古本屋 🐷", done: "防線整理完畢！古本屋隊員默默把所有繁雜傳票歸檔得完美無瑕！辛苦了，快強制斷電休息去！" },
            "manager": { name: "戰術參謀 經理 🐰", done: "經理參謀辛苦了！防線防守成功，Q2 風暴順利解除，現在馬上跟著兔兔隊員一起快樂斷電下班！" },
            "partner": { name: "最高統帥 栗子饅頭 🌰", done: "哈啊——！（吐氣）報告簽核完畢！今晚最完美的特工配置就是立刻撤離，回去享受大叔般的深夜安穩睡眠！" }
        };

        const foodDatabase = {
            lunch: [
                "🍱 慶城海南雞飯（1號餐极速外帶，回基地快速補給）",
                "🍛 興安街 家鄉四川抄手麵（辣度全開，強力抗壓）",
                "🍜 興安街 3元6青蛙湯/虱目魚粥（深夜突擊的熱湯防禦）",
                "🍲 包記饅頭 或 附近的排骨便當（厚實高熱量，迎戰高強度查核）"
            ],
            drink: [
                "🥤 得正 Oolong Tea（空投焙烏龍加茶凍，續命神物）",
                "🧋 約翰紅茶公司（點煮濃那鐵，用濃郁乳香麻痺數字痛苦）",
                "🍵 烏弄 UNOCHA（金萱冬片無糖，保持神經高度清醒）",
                "🍋 麻古茶坊（芝芝系列，快樂多酚大暴走）"
            ]
        };

        let currentLevel = localStorage.getItem("tg_lvl") || "ic"; 
        let currentStaff = localStorage.getItem("tg_stf") || "usagi"; 
        let allTodos = JSON.parse(localStorage.getItem("tg_todos_v5")) || {};

        function getActiveKey() {
            return currentLevel === "staff" ? `staff_${currentStaff}` : currentLevel;
        }

        if (Object.keys(allTodos).length === 0) {
            Object.keys(defaultTasks).forEach(k => {
                allTodos[k] = defaultTasks[k].map(t => ({ text: t, completed: false }));
            });
        }

        function switchLevel(lvl) {
            currentLevel = lvl;
            localStorage.setItem("tg_lvl", lvl);
            
            document.querySelectorAll(".level-btn").forEach(b => b.classList.remove("active"));
            document.getElementById(`lvl-${lvl}`).classList.add("active");

            const staffBox = document.getElementById("staff-sub-box");
            if (lvl === "staff") {
                staffBox.style.display = "flex";
            } else {
                staffBox.style.display = "none";
            }
            
            document.getElementById("food-result").style.display = "none";
            render();
        }

        function switchStaff(stf) {
            currentStaff = stf;
            localStorage.setItem("tg_stf", stf);
            
            document.querySelectorAll(".staff-btn").forEach(b => b.classList.remove("active"));
            const btn = document.querySelector(`.staff-btn[data-staff="${stf}"]`);
            if (btn) btn.classList.add("active");
            
            document.getElementById("food-result").style.display = "none";
            render();
        }

        function updateProgress() {
            const key = getActiveKey();
            const list = allTodos[key] || [];
            const total = list.length;
            const done = list.filter(t => t.completed).length;
            const pct = total === 0 ? 0 : Math.round((done / total) * 100);

            document.getElementById("progress-role-label").innerText = `⚡ ${roleMeta[key].name} // 行動達成度`;
            document.getElementById("progress-percent").innerText = `${pct}%`;
            document.getElementById("progress-fill").style.width = `${pct}%`;

            const btn = document.getElementById("shutdown-btn");
            if (pct === 100 && total > 0) {
                btn.classList.add("ready");
                btn.innerText = "⚠️ TACTICAL CLEAR // 解鎖大腦強制關機撤離";
                btn.disabled = false;
            } else {
                btn.classList.remove("ready");
                btn.innerText = `🔒 請先解除所有威脅項目以解鎖撤離 (${done}/${total})`;
                btn.disabled = true;
            }
        }

        function render() {
            const key = getActiveKey();
            const listEl = document.getElementById("todo-list");
            listEl.innerHTML = "";
            const list = allTodos[key] || [];

            list.forEach((todo, idx) => {
                const item = document.createElement("div");
                item.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                item.innerHTML = `
                    <div class="todo-left" onclick="toggleTodo(${idx})">
                        <div class="checkbox"></div>
                        <div class="todo-text">${todo.text}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteTodo(${idx})">✕</button>
                `;
                listEl.appendChild(item);
            });

            localStorage.setItem("tg_todos_v5", JSON.stringify(allTodos));
            updateProgress();
        }

        function addTodo() {
            const input = document.getElementById("todo-input");
            const text = input.value.trim();
            if (text) {
                const key = getActiveKey();
                allTodos[key].unshift({ text: `[${roleMeta[key].name.split(' ')[1]}任務] ${text}`, completed: false });
                input.value = "";
                render();
            }
        }

        function handleKeyPress(e) { if (e.key === "Enter") addTodo(); }
        function toggleTodo(idx) { const key = getActiveKey(); allTodos[key][idx].completed = !allTodos[key][idx].completed; render(); }
        function deleteTodo(idx) { const key = getActiveKey(); allTodos[key].splice(idx, 1); render(); }

        function getRandomFood(type) {
            const list = foodDatabase[type];
            const res = list[Math.floor(Math.random() * list.length)];
            const el = document.getElementById("food-result");
            el.style.display = "block";
            el.innerHTML = type === 'lunch' ? `📡 <b>戰地物資報告：</b><br>${res}` : `📡 <b>空投能量補給：</b><br>${res}`;
        }

        function updateCountdown() {
            const target = new Date("2026-08-14T00:00:00+08:00");
            const diff = target - new Date();
            if (diff <= 0) {
                document.getElementById("countdown-display").innerText = "💥 ACTION COMPLETE // 突擊日已到，全員撤離！";
                return;
            }
            const d = Math.floor(diff / 86400000);
            const h = Math.floor((diff % 86400000) / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            document.getElementById("countdown-display").innerText = `⏳ 距離 8/14 死線決戰：${d} 天 ${h} 小時 ${m} 分`;
        }

        function triggerShutdown() {
            const key = getActiveKey();
            document.getElementById("modal-title").innerText = `💥 代號 [${roleMeta[key].name}] 任務全清空！`;
            document.getElementById("modal-quote").innerText = roleMeta[key].done;
            document.getElementById("overlay").style.display = "flex";
        }
        function closeModal() { document.getElementById("overlay").style.display = "none"; }

        document.addEventListener("DOMContentLoaded", () => {
            switchLevel(currentLevel);
            if (currentLevel === "staff") switchStaff(currentStaff);
            setInterval(updateCountdown, 60000);
            updateCountdown();
        });
    </script>
</body>
</html>
