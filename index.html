<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌙 IC Workspace</title>
    <style>
        :root {
            --bg-color: #060a12;
            --card-bg: rgba(15, 23, 42, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --esun-green: #10b981;
            --esun-glow: rgba(16, 185, 129, 0.15);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            margin: 0;
            padding: 24px 16px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* 頂級極光背景層 */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 80% 20%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 2;
        }

        header {
            text-align: center;
            margin-bottom: 28px;
            margin-top: 10px;
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 6px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1.05rem;
            color: var(--esun-green);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* 輸入框區塊 */
        .input-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 20px;
            display: flex;
            gap: 10px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 24px;
        }

        .input-section input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.15rem;
            padding: 8px 12px;
            outline: none;
        }

        .input-section input::placeholder {
            color: #475569;
        }

        .add-btn {
            background: var(--esun-green);
            color: #042f1a;
            border: none;
            border-radius: 14px;
            padding: 0 20px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-btn:active {
            transform: scale(0.95);
        }

        /* 列表區塊 */
        .todo-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }

        .todo-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px 18px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .todo-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
        }

        .checkbox {
            width: 26px;
            height: 26px;
            border: 2px solid #475569;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .todo-text {
            font-size: 1.25rem;
            font-weight: 500;
            color: var(--text-main);
            line-height: 1.4;
        }

        .todo-item.completed {
            border-color: rgba(16, 185, 129, 0.15);
            background: rgba(15, 23, 42, 0.35);
            opacity: 0.5;
        }

        .todo-item.completed .checkbox {
            background: var(--esun-green);
            border-color: var(--esun-green);
        }

        .todo-item.completed .checkbox::after {
            content: "✓";
            color: #042f1a;
            font-size: 1.1rem;
            font-weight: 900;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-sub);
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            font-size: 1.25rem;
            cursor: pointer;
            padding: 8px;
            opacity: 0.4;
        }

        .logout-section {
            text-align: center;
            margin-top: 40px;
        }

        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
            padding: 18px 32px;
            border-radius: 22px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.2s;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.15);
        }

        .logout-btn:active {
            background: rgba(239, 68, 68, 0.25);
            transform: scale(0.97);
        }

        /* 推薦食物彈出視窗（Modal）樣式 */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 10, 19, 0.97);
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            animation: fadeIn 0.25s ease;
        }

        .modal {
            background: #0f172a;
            border: 1px solid rgba(255,255,255,0.12);
            padding: 36px 28px;
            border-radius: 32px;
            max-width: 360px;
            width: 88%;
            text-align: center;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8);
            animation: slideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal h2 {
            color: #fca5a5;
            font-size: 1.5rem;
            margin-top: 0;
            font-weight: 700;
        }

        .food-recommend {
            background: linear-gradient(135deg, rgba(16,185,129,0.18) 0%, rgba(16,185,129,0.03) 100%);
            padding: 18px;
            border-radius: 18px;
            margin: 24px 0;
            font-weight: 700;
            color: #34d399;
            font-size: 1.25rem;
            border: 1px solid rgba(16,185,129,0.25);
            line-height: 1.4;
        }

        .quote {
            font-size: 1.1rem;
            color: #cbd5e1;
            line-height: 1.8;
            margin-bottom: 32px;
            text-align: justify;
        }

        .close-btn {
            background: #f8fafc;
            color: #0f172a;
            border: none;
            padding: 18px 25px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            font-size: 1.1rem;
            transition: all 0.2s;
        }

        .close-btn:active {
            transform: scale(0.97);
            background: #cbd5e1;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

    <div class="aurora-bg"></div>

    <div class="container">
        <header>
            <h1>🌙 Task Counter</h1>
            <div class="subtitle">E.SUN 115Q2 · 主辦 IC 戰術檯</div>
        </header>

        <div class="input-section">
            <input type="text" id="todo-input" placeholder="新增今晚必做查核項目..." onkeypress="handleKeyPress(event)">
            <button class="add-btn" onclick="addTodo()">新增</button>
        </div>

        <div class="todo-list" id="todo-list"></div>

        <div class="logout-section">
            <button class="logout-btn" onclick="triggerShutdown()">⚠️ 大腦強制關機登出</button>
        </div>
    </div>

    <!-- 推薦食物與安慰碎碎念的彈出視窗 -->
    <div id="overlay" class="overlay">
        <div class="modal">
            <h2>大腦關機 · 系統登出成功</h2>
            <div id="modal-food" class="food-recommend">推薦補給品載入中...</div>
            <p id="modal-quote" class="quote">碎碎念載入中...</p>
            <button class="close-btn" onclick="closeModal()">收到底稿，現在關機睡覺</button>
        </div>
    </div>

    <script>
        // 核心查核項目
        const defaultTasks = [
            "所得稅：核對 DTA/DTL 計算底稿與稅率調整差異",
            "貼現及放款：複核 ECL 減損計提與大額曝險分類",
            "現金流量表：勾稽直接法與間接法落差數字",
            "IC 職責：確認 Junior 底稿 review 進度與經理 mail 彙整"
        ];

        // 推薦食物與碎碎念資料庫（完全沒有牛肉麵！）
        const shutdownSupplies = [
            {
                food: "🍢 超商關東煮：熱湯 + 溫熱大根",
                quote: "115Q2 的貼現及放款、現金流量表對不起來就先卡著吧！身為扛下整個玉山集團的主辦 IC，你今天對內要 review、對外要面對客戶與經理，大腦早就超載了。去超商盛碗關東煮熱湯，把今天緊繃的壓力跟著熱氣狠狠吐出來。今晚到此為止，辛苦了！"
            },
            {
                food: "🥛 溫熱燕麥奶 或 低咖啡因熱拿鐵",
                quote: "所得稅的 DTA 和 DTL 計算表是不是在腦袋裡重影了？金融業的所得稅本來就是大魔王，你已經查得夠嚴謹了。大額曝險底稿今晚不會再變了，聽話，喝口溫熱的燕麥奶，把利息收入與複雜的勾稽公式先全部關掉。大腦該負載平衡了。"
            },
            {
                food: "🍫 2片微甜黑巧克力 + 溫開水",
                quote: "凌晨下班，從信義區或民生東路走出來，台北的街道好空。每個人都跟你說『玉山這案子全靠你了』，主辦 IC 的這份孤獨與重量，只有此時舌尖融化的黑巧克力懂。別想永久性差異了，吃點甜，把委屈吞下去轉化為明天的防禦力，現在快回家睡覺。"
            },
            {
                food: "🥣 鮮美溫熱的清鯛魚湯 或 蛤蜊湯",
                quote: "撐過了兵荒馬亂的一天，胃需要溫柔的修復。不吃油膩的宵夜折磨身體，來碗清鮮的熱湯。115Q2 的底稿已經留在辦公室了，此時此刻你不再是那個要扛起一切的主辦 IC，你只是你自己。今晚放過大腦，好好睡一覺吧。"
            }
        ];

        let todos = JSON.parse(localStorage.getItem("esun_todos"));
        if (!todos) {
            todos = defaultTasks.map(task => ({ text: task, completed: false }));
        }

        function renderTodos() {
            const listEl = document.getElementById("todo-list");
            listEl.innerHTML = "";
            todos.forEach((todo, index) => {
                const item = document.createElement("div");
                item.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                item.innerHTML = `
                    <div class="todo-left" onclick="toggleTodo(${index})">
                        <div class="checkbox"></div>
                        <div class="todo-text">${todo.text}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteTodo(${index})">✕</button>
                `;
                listEl.appendChild(item);
            });
            localStorage.setItem("esun_todos", JSON.stringify(todos));
        }

        function addTodo() {
            const input = document.getElementById("todo-input");
            const text = input.value.trim();
            if (text) {
                todos.unshift({ text: text, completed: false });
                input.value = "";
                renderTodos();
            }
        }

        function handleKeyPress(e) {
            if (e.key === "Enter") addTodo();
        }

        function toggleTodo(index) {
            todos[index].completed = !todos[index].completed;
            renderTodos();
        }

        function deleteTodo(index) {
            todos.splice(index, 1);
            renderTodos();
        }

        // 觸發大腦登出功能：隨機推薦食物與慰藉
        function triggerShutdown() {
            const randomIndex = Math.floor(Math.random() * shutdownSupplies.length);
            const supply = shutdownSupplies[randomIndex];
            
            document.getElementById("modal-food").innerText = "☕️ 深夜推薦資產：\n" + supply.food;
            document.getElementById("modal-quote").innerText = supply.quote;
            document.getElementById("overlay").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("overlay").style.display = "none";
        }

        renderTodos();
    </script>
</body>
</html>
